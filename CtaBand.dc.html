<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc><helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&amp;family=Montserrat:wght@400;500;600&amp;display=swap" rel="stylesheet"></helmet>

<section style="position:relative;padding:clamp(110px,13vw,170px) 22px;text-align:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:linear-gradient(180deg, #000 0%, rgba(0,0,0,0.78) 40%, rgba(0,0,0,0.78) 60%, #000 100%), url('https://vibe.filesafe.space/1787700865853874002/attachments/5ce77725-643e-4b94-bf6d-f9658ba08844.jpg') center / cover no-repeat, #000">
  <div data-reveal="" style="position:relative;max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center">
    <p style="font-family:'Montserrat',sans-serif;font-size:0.72rem;font-weight:500;letter-spacing:0.3em;text-transform:uppercase;margin:0 0 12px;color:#2ab8d4">{{ eyebrow }}</p>
    <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;letter-spacing:-0.01em;margin:0;font-size:clamp(2.91rem,6.72vw,4.93rem);line-height:1.04;color:#f5f5f7;text-wrap:balance">{{ title }} <span style="color:#2ab8d4;font-style:italic">{{ emph }}</span></h2>
    <p style="margin:20px 0 0;max-width:540px;font-size:1.15rem;line-height:1.5;color:rgba(255,255,255,0.72);text-wrap:pretty">{{ body }}</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 28px;margin-top:36px">
      <a href="{{ href }}" style="padding:13px 24px;border-radius:980px;background:#2ab8d4;color:#000;font-size:1.02rem;font-weight:500;text-decoration:none;transition:background .2s,transform .12s" style-hover="background:#4dd9ef;color:#000" style-active="transform:scale(0.96)">{{ button }}</a>
      <a href="tel:+19043738591" style="font-size:1.02rem;color:#2ab8d4;text-decoration:none" style-hover="text-decoration:underline">Call 904-373-8591 ›</a>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;520px&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Next step&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Let's get your business&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;emph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;flowing.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tell us where you are today and we will come back with a clear, no pressure plan.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;button&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book a call&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;contact.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { eyebrow: p.eyebrow ?? 'Next step', title: p.title ?? "Let's get your business", emph: p.emph ?? 'flowing.', body: p.body ?? 'Tell us where you are today and we will come back with a clear, no pressure plan.', button: p.button ?? 'Book a call', href: p.href ?? 'contact.dc.html' };
  }
}
</script>
</body>
</html>
