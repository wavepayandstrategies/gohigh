<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
</helmet>
<section id="faq" style="padding:clamp(80px,10vw,120px) 0;background:#060c18;font-family:'Montserrat',sans-serif">
  <div style="max-width:880px;margin:0 auto;padding:0 clamp(20px,4vw,40px)">
    <div data-reveal="" style="text-align:center;margin-bottom:56px">
      <div style="font-size:0.66rem;font-weight:500;letter-spacing:0.32em;text-transform:uppercase;color:#2ab8d4;margin-bottom:18px">{{ eyebrow }}</div>
      <h2 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.2rem,4.5vw,3.6rem);line-height:1.08;letter-spacing:-0.01em;color:#fff">{{ title }} <em style="color:#2ab8d4">{{ emph }}</em></h2>
    </div>
    <div data-reveal="" style="border-top:1px solid rgba(42,184,212,0.14)">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div style="border-bottom:1px solid rgba(42,184,212,0.14)">
          <h3 style="margin:0">
            <button onClick="{{ r.toggle }}" aria-expanded="{{ r.open }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:24px 0;background:none;border:0;cursor:pointer;text-align:left;color:#fff;font-family:'Cormorant Garamond',serif;font-size:clamp(1.2rem,2vw,1.45rem);font-weight:400" style-hover="color:#4dd9ef">
              <span>{{ r.q }}</span>
              <span style="flex-shrink:0;color:#4dd9ef;font-family:'Montserrat',sans-serif;font-size:1.2rem;font-weight:300;transition:transform .3s cubic-bezier(0.22,0.61,0.36,1);transform:{{ r.rot }}">+</span>
            </button>
          </h3>
          <sc-if value="{{ r.open }}" hint-placeholder-val="{{ false }}">
            <p style="margin:0 0 26px;max-width:720px;font-size:0.92rem;line-height:1.85;color:rgba(255,255,255,0.86);text-wrap:pretty">{{ r.a }}</p>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;700px&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;FAQ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Questions,&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;emph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;answered&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;q&quot;:&quot;Sample question?&quot;,&quot;a&quot;:&quot;Sample answer.&quot;}],&quot;tsType&quot;:&quot;{q:string,a:string}[]&quot;}}">
class Component extends DCLogic {
  state = { open: 0 };
  componentDidMount() { this.writeSchema(); }
  componentDidUpdate(p) { if (p.items !== this.props.items) this.writeSchema(); }
  componentWillUnmount() { this.ld && this.ld.remove(); }
  writeSchema() {
    const items = this.props.items || []; if (!items.length) return;
    if (!this.ld) { this.ld = document.createElement('script'); this.ld.type = 'application/ld+json'; document.head.appendChild(this.ld); }
    this.ld.text = JSON.stringify({ '@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: items.map(i => ({ '@type': 'Question', name: i.q, acceptedAnswer: { '@type': 'Answer', text: i.a } })) });
  }
  renderVals() {
    const items = this.props.items || [];
    return {
      eyebrow: this.props.eyebrow ?? 'FAQ', title: this.props.title ?? 'Questions, answered', emph: this.props.emph ?? '',
      rows: items.map((it, i) => ({ q: it.q, a: it.a, open: this.state.open === i, rot: this.state.open === i ? 'rotate(45deg)' : 'rotate(0deg)', toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })) }))
    };
  }
}
</script>
</body>
</html>
