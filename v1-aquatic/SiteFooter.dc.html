<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
</helmet>
<footer style="padding:80px 0 0;font-family:'Montserrat',sans-serif;background:linear-gradient(180deg, rgba(6,12,24,0.86) 0%, rgba(6,12,24,0.8) 100%), url('https://vibe.filesafe.space/1787700865853874002/attachments/5ce77725-643e-4b94-bf6d-f9658ba08844.jpg') center top / cover no-repeat, #060c18;border-top:1px solid rgba(42,184,212,0.14)">
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,40px)">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-bottom:40px;border-bottom:1px solid rgba(42,184,212,0.14)">
      <a href="home.dc.html" style="display:inline-flex;align-items:baseline;gap:8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.3rem;letter-spacing:0.08em;color:#fff;text-decoration:none"><span>WAVE PAY</span><span style="color:#4dd9ef">&amp;</span><span style="color:rgba(255,255,255,0.62);font-size:0.8em;letter-spacing:0.18em">STRATEGIES</span></a>
      <span style="font-size:0.6rem;letter-spacing:0.5em;text-transform:uppercase;color:#4dd9ef">Where Business Flows</span>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:12px">
        <sc-for list="{{ socials }}" as="so" hint-placeholder-count="3">
          <a href="#" style="padding:9px 18px;border-radius:24px;border:1px solid rgba(42,184,212,0.14);font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.86);text-decoration:none;transition:all .3s" style-hover="color:#4dd9ef;border-color:rgba(42,184,212,0.32);background:rgba(42,184,212,0.06);transform:translateY(-2px)">{{ so }}</a>
        </sc-for>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:44px;padding:56px 0 50px">
      <sc-for list="{{ cols }}" as="col" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:12px">
          <span style="font-size:0.6rem;font-weight:500;letter-spacing:0.28em;text-transform:uppercase;color:rgba(255,255,255,0.62);margin-bottom:6px">{{ col.title }}</span>
          <sc-for list="{{ col.links }}" as="l" hint-placeholder-count="3">
            <a href="{{ l.href }}" style="font-size:0.85rem;color:rgba(255,255,255,0.86);text-decoration:none" style-hover="color:#4dd9ef">{{ l.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <p style="margin:0 0 28px;font-size:0.74rem;line-height:1.8;color:rgba(255,255,255,0.62);text-align:center;text-wrap:pretty">Based in Palm Coast, Florida. Serving Flagler County, St. Augustine, Daytona Beach, Jacksonville, Orlando and businesses across Florida.</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:26px 0 32px;border-top:1px solid rgba(42,184,212,0.14);font-size:0.68rem;color:rgba(255,255,255,0.62)">
      <span>© 2026 Wave Pay &amp; Strategies. All rights reserved.</span>
      <div style="display:flex;gap:24px"><a href="#" style="color:rgba(255,255,255,0.62);text-decoration:none" style-hover="color:#4dd9ef">Privacy</a><a href="#" style="color:rgba(255,255,255,0.62);text-decoration:none" style-hover="color:#4dd9ef">Terms</a></div>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;560px&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (document.getElementById('wp-localbusiness')) return;
    const s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'wp-localbusiness';
    s.text = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'LocalBusiness', name: 'Wave Pay & Strategies', slogan: 'Where Business Flows',
      url: 'https://wavepayandstrategies.com', telephone: '+1-904-373-8591', email: 'info@wavepayandstrategies.com',
      founder: { '@type': 'Person', name: 'Noah Nodal' },
      address: { '@type': 'PostalAddress', addressLocality: 'Palm Coast', addressRegion: 'FL', addressCountry: 'US' },
      areaServed: ['Palm Coast, FL', 'Flagler County, FL', 'St. Augustine, FL', 'Daytona Beach, FL', 'Jacksonville, FL', 'Orlando, FL']
    });
    document.head.appendChild(s);
  }
  renderVals() {
    const L = arr => arr.map(([label, href]) => ({ label, href }));
    return {
      socials: ['Instagram', 'Facebook', 'LinkedIn'],
      cols: [
        { title: 'Core Services', links: L([['Merchant Services', 'merchant-services.dc.html'], ['Website Design', 'website-design.dc.html'], ['Local SEO', 'local-seo.dc.html']]) },
        { title: 'Growth Services', links: L([['Review Automation', 'review-automation.dc.html'], ['Google Ads Management', 'google-ads.dc.html'], ['Social Media Marketing', 'social-media.dc.html']]) },
        { title: 'Company', links: L([['All Services', 'services.dc.html'], ['About', 'about.dc.html'], ['Contact', 'contact.dc.html']]) },
        { title: 'Get in Touch', links: L([['+1 904-373-8591', 'tel:+19043738591'], ['info@wavepayandstrategies.com', 'mailto:info@wavepayandstrategies.com'], ['Palm Coast, FL', 'contact.dc.html']]) }
      ]
    };
  }
}
</script>
</body>
</html>
