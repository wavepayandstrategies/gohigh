<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc><helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&amp;family=Montserrat:wght@400;500;600&amp;display=swap" rel="stylesheet"></helmet>

<section id="faq" style="padding:clamp(100px,12vw,150px) 22px;background:#000;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif">
  <div style="max-width:860px;margin:0 auto">
    <div data-reveal="" style="margin-bottom:44px">
      <p style="font-family:'Montserrat',sans-serif;font-size:0.72rem;font-weight:500;letter-spacing:0.3em;text-transform:uppercase;margin:0 0 10px;color:#2ab8d4">{{ eyebrow }}</p>
      <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;letter-spacing:-0.01em;margin:0;font-size:clamp(2.46rem,5.15vw,3.81rem);line-height:1.06;color:#f5f5f7">{{ title }} <span style="color:#2ab8d4;font-style:italic">{{ emph }}</span></h2>
    </div>
    <div data-reveal="" style="border-top:1px solid rgba(255,255,255,0.12)">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div style="border-bottom:1px solid rgba(255,255,255,0.12)">
          <h3 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;letter-spacing:0;margin:0">
            <button onClick="{{ r.toggle }}" aria-expanded="{{ r.open }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:22px 0;background:none;border:0;cursor:pointer;text-align:left;color:#f5f5f7;font-family:inherit;font-size:clamp(1.3rem,2.1vw,1.6rem);font-weight:500;letter-spacing:0;transition:color .2s" style-hover="color:#4dd9ef">
              <span>{{ r.q }}</span>
              <span aria-hidden="true" style="flex-shrink:0;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:#f5f5f7;font-size:1.1rem;font-weight:400;transition:transform .45s cubic-bezier(0.32,0.72,0,1);transform:{{ r.rot }}">+</span>
            </button>
          </h3>
          <div style="display:grid;grid-template-rows:{{ r.rows }};transition:grid-template-rows .45s cubic-bezier(0.32,0.72,0,1)">
            <div style="overflow:hidden">
              <p style="margin:0 0 24px;max-width:720px;font-size:1rem;line-height:1.6;color:rgba(255,255,255,0.72);text-wrap:pretty;opacity:{{ r.op }};transition:opacity .3s ease">{{ r.a }}</p>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;700px&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;FAQ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Questions,&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;emph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;answered.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;q&quot;:&quot;Sample question?&quot;,&quot;a&quot;:&quot;Sample answer.&quot;}],&quot;tsType&quot;:&quot;{q:string,a:string}[]&quot;}}">
class Component extends DCLogic {
  state = { open: 0 };
  componentDidMount() { this.writeSchema(); }
  componentDidUpdate(p) { if (p.items !== this.props.items) this.writeSchema(); }
  componentWillUnmount() { this.ld && this.ld.remove(); }
  writeSchema() {
    const items = this.props.items || []; if (!items.length) return;
    if (!this.ld) { this.ld = document.createElement('script'); this.ld.type = 'application/ld+json'; document.head.appendChild(this.ld); }
    this.ld.text = JSON.stringify({ '@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: items.map(i => ({ '@type': 'Question', name: i.q, acceptedAnswer: { '@type': 'Answer', text: i.a } })) });
  }
  renderVals() {
    const items = this.props.items || [];
    return {
      eyebrow: this.props.eyebrow ?? 'FAQ', title: this.props.title ?? 'Questions,', emph: this.props.emph ?? 'answered.',
      rows: items.map((it, i) => { const o = this.state.open === i; return { q: it.q, a: it.a, open: o, rot: o ? 'rotate(45deg)' : 'none', rows: o ? '1fr' : '0fr', op: o ? 1 : 0, toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })) }; })
    };
  }
}
</script>
</body>
</html>
