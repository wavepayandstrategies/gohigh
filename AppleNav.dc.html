<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc><helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&amp;family=Montserrat:wght@400;500;600&amp;display=swap" rel="stylesheet"></helmet>

<nav ref="{{ navRef }}" aria-label="Main" style="position:fixed;top:0;left:0;right:0;z-index:100;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:rgba(0,0,0,0.62);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(255,255,255,0.08)">
  <div style="max-width:1080px;margin:0 auto;height:52px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:20px">
    <a href="home.dc.html" aria-label="Wave Pay &amp; Strategies home" style="display:flex;align-items:baseline;gap:5px;color:#fff;text-decoration:none;white-space:nowrap">
      <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:1.15rem;font-weight:600;letter-spacing:0.1em">WAVE PAY</span>
      <span style="font-family:'Montserrat',sans-serif;font-size:0.72rem;font-weight:500;letter-spacing:0.3em;text-transform:uppercase;font-family:'Cormorant Garamond',Georgia,serif;color:#4dd9ef">&amp;</span>
      <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:0.74rem;font-weight:600;letter-spacing:0.18em;color:rgba(255,255,255,0.64)">STRATEGIES</span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:4px">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.href }}" style="padding:8px 12px;font-size:0.78rem;font-weight:400;letter-spacing:-0.005em;color:{{ l.color }};text-decoration:none;white-space:nowrap;transition:color .2s" style-hover="color:#fff">{{ l.label }}</a>
        </sc-for>
      </div>
      <a href="contact.dc.html" style="padding:7px 15px;border-radius:980px;background:#2ab8d4;color:#000;font-size:0.76rem;font-weight:500;text-decoration:none;white-space:nowrap;transition:background .2s,transform .12s" style-hover="background:#4dd9ef" style-active="transform:scale(0.96)">Get a quote</a>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="Menu" aria-expanded="{{ menuOpen }}" style="width:44px;height:44px;margin-right:-10px;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
        <span style="display:block;width:18px;height:1.5px;background:#fff;border-radius:2px;transition:transform .35s cubic-bezier(0.32,0.72,0,1);transform:{{ bar1 }}"></span>
        <span style="display:block;width:18px;height:1.5px;background:#fff;border-radius:2px;transition:transform .35s cubic-bezier(0.32,0.72,0,1);transform:{{ bar2 }}"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;top:52px;left:0;right:0;bottom:0;overflow-y:auto;background:rgba(0,0,0,0.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:20px 40px 40px;display:flex;flex-direction:column">
      <sc-for list="{{ mobileLinks }}" as="l" hint-placeholder-count="9">
        <a href="{{ l.href }}" style="padding:10px 0;font-size:1.6rem;font-weight:600;letter-spacing:-0.02em;color:{{ l.color }};text-decoration:none">{{ l.label }}</a>
      </sc-for>
      <a href="contact.dc.html" style="margin-top:28px;padding:14px;border-radius:980px;text-align:center;background:#2ab8d4;color:#000;font-size:1rem;font-weight:500;text-decoration:none">Get a quote</a>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;400px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;merchant&quot;,&quot;web&quot;,&quot;seo&quot;,&quot;reviews&quot;,&quot;ads&quot;,&quot;social&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, menuOpen: false };
  navRef = React.createRef();
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target, d = +el.getAttribute('data-delay') || 0;
      setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'none'; }, reduce ? 0 : d);
      this.io.unobserve(el);
    }), { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    const prep = el => {
      if (el.__wp) return; el.__wp = 1;
      el.style.opacity = '0';
      if (!reduce) el.style.transform = 'translateY(28px) scale(0.985)';
      el.style.transition = reduce ? 'opacity .3s ease' : 'opacity .9s cubic-bezier(0.22,1,0.36,1), transform 1.1s cubic-bezier(0.22,1,0.36,1)';
      this.io.observe(el);
    };
    const scan = () => document.querySelectorAll('[data-reveal]').forEach(prep);
    scan();
    this.mo = new MutationObserver(scan);
    this.mo.observe(document.body, { childList: true, subtree: true });
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); this.io && this.io.disconnect(); this.mo && this.mo.disconnect(); }
  renderVals() {
    const active = this.props.active || '';
    const isDesktop = this.state.w > 980;
    const items = [['merchant', 'Merchant Services', 'merchant-services.dc.html'], ['web', 'Website Design', 'website-design.dc.html'], ['seo', 'Local SEO', 'local-seo.dc.html'], ['reviews', 'Reviews', 'review-automation.dc.html'], ['services', 'All Services', 'services.dc.html'], ['about', 'About', 'about.dc.html']];
    const col = k => active === k ? '#fff' : 'rgba(255,255,255,0.72)';
    const open = !isDesktop && this.state.menuOpen;
    return {
      navRef: this.navRef, isDesktop, isMobile: !isDesktop, menuOpen: open,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      bar1: open ? 'translateY(3.75px) rotate(45deg)' : 'none', bar2: open ? 'translateY(-3.75px) rotate(-45deg)' : 'none',
      links: items.map(([k, label, href]) => ({ label, href, color: col(k) })),
      mobileLinks: [...items, ['google-ads', 'Google Ads', 'google-ads.dc.html'], ['social', 'Social Media', 'social-media.dc.html'], ['contact', 'Contact', 'contact.dc.html']].map(([k, label, href]) => ({ label, href, color: active === k ? '#2ab8d4' : '#fff' }))
    };
  }
}
</script>
</body>
</html>
